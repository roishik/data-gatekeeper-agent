# Weekly dependency update PRs. Security *alerts* are a separate repo
# setting (Settings -> Code security) that has to be switched on by hand.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
